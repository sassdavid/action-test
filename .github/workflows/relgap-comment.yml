# relgap-action comment mode: relgap digest --pull-request and relgap audit each keep one comment
# on pull requests that change mise.toml, such as Renovate's.
name: relgap-comment

on:
  pull_request:
    paths: ["mise.toml", ".github/workflows/relgap-comment.yml"]

permissions: {}

concurrency:
  group: relgap-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # relgap reads the pins at the base commit
          persist-credentials: false
      - uses: sassdavid/relgap-action@e2c5845268ce5301a0331a2f2759179f08c2cc38 # fix/comment-min-0.13.1
        with:
          mode: comment

  # Comments without failing: audit gates vuln by default, and kubectl's latest release still has
  # an advisory.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sassdavid/relgap-action@e2c5845268ce5301a0331a2f2759179f08c2cc38 # fix/comment-min-0.13.1
        with:
          mode: comment
          command: audit
          args: --fail-on=

  # Comment mode refuses a relgap release older than the minimum in the action's tool.env, before
  # the install: older releases can notify upstream authors from the comment.
  old-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: relgap
        continue-on-error: true
        uses: sassdavid/relgap-action@e2c5845268ce5301a0331a2f2759179f08c2cc38 # fix/comment-min-0.13.1
        with:
          mode: comment
          version: 0.13.0
      - name: check the refusal
        env:
          OUTCOME: ${{ steps.relgap.outcome }}
          INSTALLED: ${{ steps.relgap.outputs.path }}
        run: |
          test "$OUTCOME" = failure || { echo "comment mode ran relgap 0.13.0"; exit 1; }
          test -z "$INSTALLED" || { echo "relgap was installed before the refusal"; exit 1; }
          echo "ok: refused before the install"
