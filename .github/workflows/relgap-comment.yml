# relgap-action comment mode: relgap digest --pull-request keeps one comment on pull requests
# that change mise.toml, such as Renovate's.
name: relgap-comment

on:
  pull_request:
    paths: ["mise.toml"]

permissions: {}

concurrency:
  group: relgap-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # relgap reads the pins at the base commit
          persist-credentials: false
      - uses: sassdavid/relgap-action@28d7a84b3070faa38338522a5e83e427eeae80b5 # v1.1.0
        with:
          mode: comment
