# relgap-action comment mode: relgap digest --pull-request and relgap audit each keep one comment
# on pull requests that change mise.toml, such as Renovate's.
name: relgap-comment

on:
  pull_request:
    paths: ["mise.toml", ".github/workflows/relgap-comment.yml"]

permissions: {}

concurrency:
  group: relgap-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # relgap reads the pins at the base commit
          persist-credentials: false
      - uses: sassdavid/relgap-action@72f0b2c5c6db2930ef7d3410e4700eeec60595e8 # v1.3.1
        with:
          mode: comment

  # Comments without failing: audit gates vuln by default, and kubectl's latest release still has
  # an advisory.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sassdavid/relgap-action@72f0b2c5c6db2930ef7d3410e4700eeec60595e8 # v1.3.1
        with:
          mode: comment
          command: audit
          args: --fail-on=
